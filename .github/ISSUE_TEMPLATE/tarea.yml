name: Tarea de proyecto
description: Planificar diseño, implementación o verificación de un subsistema.
title: "[Sustituir por subsistema] "
body:
  - type: input
    id: scope
    attributes:
      label: Proyecto, subsistema y responsable
      description: Indica también la rama personal. Asigna el issue al integrante en GitHub.
    validations:
      required: true
  - type: textarea
    id: objective
    attributes:
      label: Objetivo
      description: Describe qué problema o requisito resuelve esta tarea.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Criterios de aceptación
      description: Resultados concretos y verificables necesarios para cerrar la tarea.
    validations:
      required: true
  - type: textarea
    id: integration
    attributes:
      label: Dependencias y acuerdos de interfaz
      description: Puertos, datos, latencias y responsables con quienes hay que coordinar.
  - type: textarea
    id: evidence
    attributes:
      label: Avances y evidencia
      description: Añade commits, Pull Requests, comandos y resultados conforme avances.
