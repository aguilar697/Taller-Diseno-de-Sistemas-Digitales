<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1300" viewBox="0 0 1900 1300" role="img" aria-labelledby="title desc">
<title id="title">Segundo nivel: arquitectura MicroBlaze V y periféricos</title>
<desc id="desc">MicroBlaze V accede a memoria y periféricos AXI. El Timer interrumpe al procesador; el PWM dispara la adquisición ADC. La aplicación PR se ejecuta en C dentro del procesador.</desc>
