<text x="1000" y="87" text-anchor="middle" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#475569">Cuarto nivel · Recepción, validación y actualización</text>
<text x="80" y="140" text-anchor="start" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0F172A">A. Escritura</text>
