<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1390" viewBox="0 0 2000 1390" role="img" aria-labelledby="title desc">
<title id="title">Cuarto nivel PWM: AXI y registros</title>
<desc id="desc">Capturas independientes AW/W, escritura única, respuestas B/R registradas y transferencia coherente de referencia pendiente al comienzo de período.</desc>
