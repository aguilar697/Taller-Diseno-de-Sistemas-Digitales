<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1540" viewBox="0 0 1900 1540" role="img" aria-labelledby="title desc">
<title id="title">Plataforma digital MicroBlaze V: reloj, memoria y periféricos</title><desc id="desc">Una BRAM física de 32 KiB se comparte entre datos por DLMB e instrucciones por AXI y caché. SmartConnect conecta siete periféricos. Se indican reloj, resets, depuración, interrupción y sincronización PWM hacia ADC. Asignación JC de la plataforma digital independiente.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0 0 L10 4 L0 8 Z" fill="#475569"/></marker></defs>
